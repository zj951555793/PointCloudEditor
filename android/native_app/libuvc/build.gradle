plugins {
    id 'com.android.library'
}

import org.apache.tools.ant.taskdefs.condition.Os

android {
    namespace 'com.jiangdg.uvccamera'
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 24
        targetSdk 37
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/libs']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

String getNdkBuildPath() {
    def ndkBuildingDir = System.getenv('NDK_HOME')
    if (ndkBuildingDir == null || ndkBuildingDir.isEmpty()) {
        Properties properties = new Properties()
        def localProps = project.rootProject.file('local.properties')
        if (localProps.exists()) {
            properties.load(localProps.newDataInputStream())
            ndkBuildingDir = properties.getProperty('ndk.dir')
        }
    }
    if (ndkBuildingDir == null || ndkBuildingDir.isEmpty()) {
        def sdkDir = android.sdkDirectory
        def ndkDir = android.ndkDirectory
        ndkBuildingDir = ndkDir != null ? ndkDir.absolutePath : new File(sdkDir, 'ndk-bundle').absolutePath
    }
    return Os.isFamily(Os.FAMILY_WINDOWS)
        ? ndkBuildingDir + '/ndk-build.cmd'
        : ndkBuildingDir + '/ndk-build'
}

tasks.register('ndkBuild', Exec) {
    description = 'Compile JNI source via NDK'
    commandLine getNdkBuildPath(), '-j8', '-C', file('src/main').absolutePath
}

tasks.register('ndkClean', Exec) {
    description = 'Clean JNI libraries'
    commandLine getNdkBuildPath(), 'clean', '-C', file('src/main').absolutePath
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('ndkBuild')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('ndkBuild')
}

tasks.named('clean').configure {
    dependsOn tasks.named('ndkClean')
}

dependencies {
    implementation fileTree(dir: new File(buildDir, 'libs'), include: '*.jar')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.elvishew:xlog:1.11.0'
    implementation project(path: ':libuvccommon')
}
